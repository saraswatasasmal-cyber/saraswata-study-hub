<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saraswata Study Hub - Materials</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7f6; }
        h1 { color: #333; text-align: center; }
        .controls { text-align: center; margin-bottom: 20px; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #0056b3; }
        .card p { color: #666; font-size: 14px; }
        .download-btn { display: inline-block; background: #0056b3; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .download-btn:hover { background: #004085; }
    </style>
</head>
<body>

    <h1>Saraswata Study Hub 📚</h1>
    
    <div class="controls">
        <label for="classFilter">Filter by Class: </label>
        <select id="classFilter" onchange="filterMaterials()">
            <option value="all">All Classes</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
        </select>
    </div>

    <div class="grid" id="materialsGrid">
        <p style="text-align:center; grid-column: 1/-1;">Loading study materials...</p>
    </div>

    <!-- Combined Standalone Execution Script Module -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, getDocs } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AlzaSyBGCw2svZZVMyRew878HjEghJdudO0HrU",
            authDomain: "://firebaseapp.com",
            projectId: "saraswata-study-hub",
            storageBucket: "://appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allMaterials = [];

        async function loadMaterials() {
            try {
                const grid = document.getElementById('materialsGrid');
                const querySnapshot = await getDocs(collection(db, "pdfs"));
                allMaterials = [];
                
                querySnapshot.forEach((doc) => {
                    allMaterials.push(doc.data());
                });

                grid.innerHTML = "";

                if (allMaterials.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; color:#ff9900; background:#fff3cd; padding:20px; border-radius:5px;">
                            ⚠️ Connected to Firebase successfully, but your collection is empty! Try uploading a new file from your admin panel.
                        </div>`;
                    return;
                }

                displayMaterials(allMaterials);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('materialsGrid').innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; color:#721c24; background:#f8d7da; padding:20px; border-radius:5px;">
                        ❌ Database Blocked: Make sure your Firestore rules are set to public.
                    </div>`;
            }
        }

        window.displayMaterials = function(materials) {
            const grid = document.getElementById('materialsGrid');
            grid.innerHTML = "";
            materials.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.name || 'Untitled Document'}</h3>
                    <p>Class: ${item.class || 'N/A'}</p>
                    <a href="${item.url}" target="_blank" class="download-btn">Download PDF</a>
                `;
                grid.appendChild(card);
            });
        }

        window.filterMaterials = function() {
            const selectedClass = document.getElementById('classFilter').value;
            if(selectedClass === "all") {
                displayMaterials(allMaterials);
            } else {
                const filtered = allMaterials.filter(item => String(item.class) === selectedClass);
                displayMaterials(filtered);
            }
        }

        loadMaterials();
    </script>
</body>
</html>
